[package]
name = "fravashi"
version = "3.0.0"
edition = "2021"

[[bin]]
name = "fravashi"
path = "main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
axum = "0.7"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
flate2 = "1.0"
chrono = "0.4"
tower-http = { version = "0.5", features = ["fs"] }
sha1 = "0.10"
aes-gcm = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
